name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend install (lockfile) and unit tests
        run: |
          npm ci --no-audit --no-fund
          npm test
        working-directory: web
      - name: Build React frontend
        run: npm run build
        working-directory: web
      - name: Configure C++ host build (disk resources)
        run: cmake --preset dev-disk -DEDGEDESK_BUILD_WEB=OFF
      - name: Build C++ and libhv
        run: cmake --build --preset dev-disk
      - name: Native unit tests
        run: ctest --preset dev-disk
      - name: HTTP smoke + end-to-end integration (REST, WebSocket, rate limit, audit)
        run: bash scripts/integration_test.sh out/build/dev-disk/bin/edgedesk 19091 web/dist

  gcc15-embed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React dist for embedding
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - name: GCC 15 #embed compile, tests and smoke test
        run: |
          docker run --rm -v "$PWD:/work" -w /work gcc:15 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cmake ninja-build python3 git curl >/dev/null
            cmake -S . -B out/build/ci-gcc15-embed -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDGEDESK_WEB_MODE=embed -DEDGEDESK_BUILD_WEB=OFF
            cmake --build out/build/ci-gcc15-embed --parallel 3
            ctest --test-dir out/build/ci-gcc15-embed --output-on-failure
            bash scripts/integration_test.sh out/build/ci-gcc15-embed/bin/edgedesk 19092 web/dist
          '

  x86_64-musl-static:
    # musl static-pie release target, disk resource mode (musl.cc ships GCC 11).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch musl cross toolchain
        run: |
          mkdir -p "$HOME/opt/musl" && cd "$HOME/opt/musl"
          curl -fsSL -o x86_64-linux-musl-cross.tgz https://musl.cc/x86_64-linux-musl-cross.tgz
          tar xzf x86_64-linux-musl-cross.tgz
      - name: Cross build (static-pie)
        run: |
          cmake -S . -B out/build/x86_64-musl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEDGEDESK_WEB_MODE=disk -DEDGEDESK_BUILD_WEB=OFF -DEDGEDESK_STATIC_PIE=ON \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-linux-musl.cmake \
            -DEDGEDESK_TOOLCHAIN_ROOT="$HOME/opt/musl/x86_64-linux-musl-cross"
          cmake --build out/build/x86_64-musl --parallel 3
          file out/build/x86_64-musl/bin/edgedesk
      - name: Unit tests (static musl binaries)
        run: ctest --test-dir out/build/x86_64-musl --output-on-failure
      - name: Integration tests
        run: bash scripts/integration_test.sh out/build/x86_64-musl/bin/edgedesk 19093 ""

  arm64-cross:
    # Real AArch64 cross build executed under qemu-user-static. Mirrors the
    # locally verified recipe in docs/testing.md (extracted deb prefix,
    # ARM64 bash for the PTY tests, disk resource mode).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch cross toolchain, qemu and ARM64 bash (no root)
        run: |
          mkdir -p "$HOME/opt/arm64/debs" "$HOME/opt/arm64/root" "$HOME/opt/arm64/hostlibs"
          cd "$HOME/opt/arm64/debs"
          apt-get download $(apt-cache depends --recurse --no-recommends --no-suggests \
            --no-conflicts --no-breaks --no-replaces --no-enhances g++-aarch64-linux-gnu qemu-user-static \
            | grep '^\w' | sort -u)
          for d in *.deb; do dpkg -x "$d" "$HOME/opt/arm64/root"; done
          cd "$HOME/opt/arm64/hostlibs"
          ln -sf "$HOME"/opt/arm64/root/usr/lib/x86_64-linux-gnu/libopcodes-2.42-arm64.so .
          ln -sf "$HOME"/opt/arm64/root/usr/lib/x86_64-linux-gnu/libbfd-2.42-arm64.so .
          ln -sf "$HOME"/opt/arm64/root/usr/lib/x86_64-linux-gnu/libctf-arm64.so.0.0.0 .
          ln -sf "$HOME"/opt/arm64/root/usr/lib/x86_64-linux-gnu/libctf-nobfd-arm64.so.0.0.0 .
          ln -sf libctf-arm64.so.0.0.0 libctf-arm64.so.0
          ln -sf libctf-nobfd-arm64.so.0.0.0 libctf-nobfd-arm64.so.0
          cd "$HOME/opt/arm64/root"
          mkdir -p lib usr/lib
          ln -sfn ../usr/aarch64-linux-gnu/lib lib/aarch64-linux-gnu
          ln -sfn ../aarch64-linux-gnu/lib usr/lib/aarch64-linux-gnu
          ln -sf ../usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 lib/ld-linux-aarch64.so.1
          ln -sfn usr/bin bin
      - name: Install ARM64 bash for the terminal tests
        run: |
          bash_url=$(curl -fsSL http://ports.ubuntu.com/ubuntu-ports/pool/main/b/bash/ \
            | grep -o 'bash_[0-9][^"]*_arm64\.deb' | sort -V | tail -1)
          tinfo_url=$(curl -fsSL http://ports.ubuntu.com/ubuntu-ports/pool/main/n/ncurses/ \
            | grep -o 'libtinfo6_[0-9][^"]*_arm64\.deb' | sort -V | tail -1)
          curl -fsSL -o /tmp/bash.deb "http://ports.ubuntu.com/ubuntu-ports/pool/main/b/bash/$bash_url"
          curl -fsSL -o /tmp/libtinfo6.deb "http://ports.ubuntu.com/ubuntu-ports/pool/main/n/ncurses/$tinfo_url"
          dpkg -x /tmp/bash.deb "$HOME/opt/arm64/root"
          dpkg -x /tmp/libtinfo6.deb "$HOME/opt/arm64/root"
          "$HOME/opt/arm64/root/usr/bin/qemu-aarch64-static" -L "$HOME/opt/arm64/root" \
            "$HOME/opt/arm64/root/bin/bash" --version | head -1
      - name: Cross build (disk resources)
        run: |
          export LD_LIBRARY_PATH="$HOME/opt/arm64/hostlibs"
          cmake -S . -B out/build/arm64-disk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DEDGEDESK_WEB_MODE=disk -DEDGEDESK_BUILD_WEB=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake \
            -DEDGEDESK_TOOLCHAIN_ROOT="$HOME/opt/arm64/root"
          cmake --build out/build/arm64-disk --parallel 3
          file out/build/arm64-disk/bin/edgedesk
      - name: Run integration tests under qemu
        run: |
          bash scripts/integration_test.sh out/build/arm64-disk/bin/edgedesk 19094 "" \
            "$HOME/opt/arm64/root/usr/bin/qemu-aarch64-static -L $HOME/opt/arm64/root"
