<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">EdgeDesk Mountain Lake</title>
  <desc id="desc">A blue twilight sky, layered mountains, and a calm lake designed as a low-contrast desktop wallpaper.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12365c"/>
      <stop offset=".42" stop-color="#477aa2"/>
      <stop offset=".68" stop-color="#e18c83"/>
      <stop offset="1" stop-color="#f6b38b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244e70"/>
      <stop offset=".6" stop-color="#102c47"/>
      <stop offset="1" stop-color="#071a2d"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a18c" stop-opacity=".48"/>
      <stop offset="1" stop-color="#f2a18c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="48%">
      <stop offset="0" stop-color="#ffbc98" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffbc98" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>
